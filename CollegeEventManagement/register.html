<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="auth-shell">
      <form class="auth-card" id="registerForm" novalidate>
        <h1>Create Account</h1>
        <p class="subtext">Register as a student to join campus events.</p>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required />

        <label for="rollNumber">Roll Number</label>
        <input type="text" id="rollNumber" name="rollNumber" required />

        <label for="department">Department</label>
        <input type="text" id="department" name="department" required />

        <label for="year">Year</label>
        <input type="number" id="year" name="year" min="1" max="4" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <button type="submit" class="btn btn-block">Register</button>
        <p class="helper-text">
          Already registered? <a href="login.html">Login</a>
        </p>
      </form>
    </div>

    <script src="js/validation.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
