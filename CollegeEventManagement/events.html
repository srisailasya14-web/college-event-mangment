<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events</title>
    <link rel="stylesheet" href="css/events.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-bar">
        <a href="dashboard.html" class="brand">CampusSphere</a>
        <nav class="nav-links">
          <a href="dashboard.html">Dashboard</a>
          <a href="events.html">Events</a>
          <a href="my-registrations.html">My Registrations</a>
          <a href="index.html">Logout</a>
        </nav>
      </div>
    </header>

    <main class="container page-section">
      <div class="section-heading">
        <h1>Events</h1>
        <p>Search, filter, and register for campus events.</p>
      </div>

      <div class="controls">
        <input type="search" id="searchInput" placeholder="Search by event name" />
        <select id="filterSelect">
          <option value="all">All Categories</option>
          <option value="Technical">Technical</option>
          <option value="Cultural">Cultural</option>
          <option value="Sports">Sports</option>
        </select>
        <select id="sortSelect">
          <option value="date">Sort by Date</option>
          <option value="seats">Sort by Seats</option>
          <option value="name">Sort by Name</option>
        </select>
      </div>

      <div id="eventsContainer" class="card-grid"></div>
    </main>

    <script src="js/events.js"></script>
  </body>
</html>
