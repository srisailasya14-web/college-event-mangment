<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="dashboard-header">
      <div class="container nav-bar">
        <a href="dashboard.html" class="brand">CampusSphere</a>
        <nav class="nav-links">
          <a href="dashboard.html">Dashboard</a>
          <a href="events.html">Events</a>
          <a href="my-registrations.html">My Registrations</a>
          <a href="index.html" id="logoutBtn">Logout</a>
        </nav>
      </div>
    </header>

    <main class="container dashboard-main">
      <section class="welcome-card">
        <h1>Welcome, <span id="studentName">Student</span></h1>
        <p>Stay on top of your events and registrations.</p>
      </section>

      <section class="stats-grid">
        <article class="stat-card">
          <h3 id="totalEvents">0</h3>
          <p>Total Events</p>
        </article>
        <article class="stat-card">
          <h3 id="registeredEvents">0</h3>
          <p>Registered Events</p>
        </article>
        <article class="stat-card">
          <h3 id="upcomingEvents">0</h3>
          <p>Upcoming Events</p>
        </article>
      </section>

      <section class="card-grid dashboard-cards">
        <a href="events.html" class="card nav-card">Browse Events</a>
        <a href="my-registrations.html" class="card nav-card">View Registrations</a>
        <a href="contact.html" class="card nav-card">Contact Support</a>
      </section>
    </main>

    <script src="js/dashboard.js"></script>
  </body>
</html>
