<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="dashboard-header">
      <div class="container nav-bar">
        <a href="admin.html" class="brand">CampusSphere Admin</a>
        <nav class="nav-links">
          <a href="index.html">Logout</a>
        </nav>
      </div>
    </header>

    <main class="container dashboard-main">
      <section class="welcome-card">
        <h1>Admin Control Center</h1>
        <p>Manage events and review student registrations.</p>
      </section>

      <section class="welcome-card">
        <h2>Add or Update Event</h2>
        <form id="adminForm">
          <input type="hidden" id="eventId" />
          <label for="eventName">Event Name</label>
          <input type="text" id="eventName" required />

          <label for="description">Description</label>
          <textarea id="description" rows="3" required></textarea>

          <label for="eventDate">Date</label>
          <input type="date" id="eventDate" required />

          <label for="venue">Venue</label>
          <input type="text" id="venue" required />

          <label for="availableSeats">Available Seats</label>
          <input type="number" id="availableSeats" min="0" required />

          <label for="category">Category</label>
          <input type="text" id="category" required />

          <button type="submit" class="btn">Save Event</button>
        </form>
      </section>

      <section class="welcome-card">
        <h2>All Events</h2>
        <div id="adminEventsContainer" class="card-grid"></div>
      </section>

      <section class="welcome-card">
        <h2>All Student Registrations</h2>
        <div id="adminRegistrationsContainer" class="card-grid"></div>
      </section>
    </main>

    <script src="js/admin.js"></script>
  </body>
</html>
